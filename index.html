<!doctype html>
<html lang="en" data-size="m">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Opcode — learn C++, then build a NES emulator</title>
  <meta name="description" content="An interactive course that teaches C++ from zero and then guides you through writing a NES emulator, with a real C++ compiler running in your browser.">
  <script>
    // Apply saved view settings before the first paint.
    try {
      var p = JSON.parse(localStorage.getItem('opcode.prefs') || '{}');
      if (p.size) document.documentElement.dataset.size = p.size;
      document.documentElement.dataset.map = p.map || (window.innerWidth >= 1400 ? 'open' : 'closed');
    } catch (e) { document.documentElement.dataset.map = 'open'; }
  </script>
  <link rel="stylesheet" href="vendor/fonts/fonts.css">
  <link rel="stylesheet" href="vendor/codemirror/codemirror.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%23CBC8C2'/><rect x='3' y='6' width='4' height='4' rx='1' fill='%23C8102E'/></svg>">
</head>
<body>
  <div class="layout">
    <aside class="side" id="side" aria-label="Course map">
      <div class="brand">
        <span class="led" id="led" aria-hidden="true"></span>
        <div>
          <div class="wordmark">Opcode</div>
          <div class="brand-sub">C++, then a NES</div>
        </div>
      </div>
      <div class="compiler-status" id="compiler-status" role="status">
        <span id="compiler-status-text">Compiler not loaded</span>
        <span class="meter" aria-hidden="true"><span id="compiler-meter"></span></span>
      </div>
      <nav id="course-map" class="course-map"></nav>
      <div class="side-foot">
        <span class="side-foot-label" id="size-label">Text size</span>
        <div class="size-switch" role="radiogroup" aria-labelledby="size-label">
          <button type="button" role="radio" data-size="s" class="size-s" aria-label="Small text">A</button>
          <button type="button" role="radio" data-size="m" class="size-m" aria-label="Medium text">A</button>
          <button type="button" role="radio" data-size="l" class="size-l" aria-label="Large text">A</button>
        </div>
        <button type="button" class="reset-all" id="btn-reset-all" title="Delete everything this site keeps in your browser">Reset all progress…</button>
      </div>
    </aside>

    <main class="lesson" id="lesson" tabindex="-1">
      <div class="lesson-bar">
        <button type="button" class="map-toggle" id="map-toggle" aria-controls="side">
          <span class="map-toggle-icon" aria-hidden="true"><i></i><i></i><i></i></span>
          <span id="map-toggle-text">Lessons</span>
        </button>
      </div>
      <div id="lesson-content"></div>
    </main>

    <div class="tv" id="screen-wrap" hidden>
      <div class="tv-frame" role="region" aria-label="Your program's picture">
        <div class="tv-bar">
          <span class="tv-led" id="tv-led" aria-hidden="true"></span>
          <span class="tv-title">Screen</span>
          <span class="tv-help">Click the picture to play: arrows, <kbd>X</kbd> A, <kbd>Z</kbd> B, <kbd>Enter</kbd> Start, <kbd>Shift</kbd> Select</span>
          <button class="btn small ghost" id="btn-sound" type="button" aria-pressed="true" hidden>Sound on</button>
          <button class="btn small" id="btn-tv-close" type="button">Back to the lesson</button>
        </div>
        <canvas id="screen" width="256" height="240" tabindex="0" aria-label="The program's picture. Click it to use the keyboard as a controller."></canvas>
        <div class="pad" id="pad" aria-label="Touch controller">
          <div class="pad-cross">
            <span data-bit="80"></span><button type="button" data-bit="16" aria-label="Up"></button><span data-bit="144"></span>
            <button type="button" data-bit="64" aria-label="Left"></button><span class="pad-hub"></span><button type="button" data-bit="128" aria-label="Right"></button>
            <span data-bit="96"></span><button type="button" data-bit="32" aria-label="Down"></button><span data-bit="160"></span>
          </div>
          <div class="pad-mid">
            <button type="button" data-bit="4">Select</button>
            <button type="button" data-bit="8">Start</button>
          </div>
          <div class="pad-ab">
            <button type="button" data-bit="2">B</button>
            <button type="button" data-bit="1">A</button>
          </div>
        </div>
      </div>
    </div>

    <section class="bench" id="bench" aria-label="Exercise workbench">
      <header class="bench-head">
        <div class="ex-switch-row">
          <div class="ex-switch" id="ex-switch"></div>
          <button type="button" class="btn ghost small" id="btn-task" aria-controls="ex-prompt" aria-expanded="true">Hide task</button>
        </div>
        <h2 class="ex-title" id="ex-title"></h2>
      </header>
      <div class="ex-prompt" id="ex-prompt"></div>

      <div class="pane code-pane">
        <div class="toolbar">
          <div class="file-tabs" id="file-tabs" role="tablist" aria-label="Files"></div>
        </div>
        <div class="editor" id="editor"></div>
        <div class="run-bar">
          <div class="tools">
            <button class="btn ghost" id="btn-reset" title="Put the starting code back">Reset</button>
            <button class="btn ghost" id="btn-hint">Hint</button>
            <button class="btn ghost" id="btn-solution">Solution</button>
            <button class="btn ghost" id="btn-download" title="Download every file of your emulator project as a .zip" hidden>Download</button>
            <button class="btn ghost" id="btn-tv-open" type="button" hidden>Screen</button>
          </div>
          <button class="btn" id="btn-run" title="Run (Ctrl+Enter)">Run</button>
          <button class="btn primary" id="btn-check" title="Check (Ctrl+Shift+Enter)">Check</button>
        </div>
      </div>

      <div class="splitter" id="splitter" role="separator" aria-orientation="horizontal" aria-label="Resize the editor and the console" tabindex="0"></div>

      <div class="pane out-pane">
        <div class="io rom-row" id="rom-row" hidden>
          <label class="io-label" for="rom-select">Cartridge</label>
          <select id="rom-select" class="rom-select"></select>
          <input type="file" id="rom-file" accept=".nes,application/octet-stream" hidden>
        </div>
        <div class="io">
          <label class="io-label" for="stdin">Program input</label>
          <textarea id="stdin" class="stdin" rows="1" spellcheck="false" placeholder="What your program reads with std::cin"></textarea>
        </div>
        <div class="console-head">
          <span id="console-title">Console</span>
          <button class="btn ghost small" id="btn-clear">Clear</button>
        </div>
        <div class="console" id="console" aria-live="polite"></div>
      </div>
    </section>
  </div>

  <nav class="mobile-tabs" id="mobile-tabs" aria-label="Lesson or exercise">
    <button type="button" data-view="lesson" aria-pressed="true">Lesson</button>
    <button type="button" data-view="code" aria-pressed="false"><span id="mobile-ex-label">Exercise</span></button>
  </nav>

  <script src="vendor/codemirror/codemirror.js"></script>
  <script src="vendor/codemirror/clike.js"></script>
  <script src="vendor/codemirror/matchbrackets.js"></script>
  <script src="vendor/codemirror/closebrackets.js"></script>
  <script src="vendor/codemirror/comment.js"></script>

  <script src="js/course.js"></script>
  <script src="lessons/cpp-hello.js"></script>
  <script src="lessons/cpp-values.js"></script>
  <script src="lessons/cpp-control.js"></script>
  <script src="lessons/cpp-functions.js"></script>
  <script src="lessons/cpp-arrays.js"></script>
  <script src="lessons/cpp-strings.js"></script>
  <script src="lessons/cpp-references.js"></script>
  <script src="lessons/cpp-classes.js"></script>
  <script src="lessons/cpp-memory.js"></script>
  <script src="lessons/cpp-bits.js"></script>
  <script src="lessons/cpp-inheritance.js"></script>
  <script src="lessons/cpp-files.js"></script>
  <script src="lessons/cpu-data.js"></script>
  <script src="lessons/nes-overview.js"></script>
  <script src="lessons/cpu-common.js"></script>
  <script src="lessons/nes-cpu-bus.js"></script>
  <script src="lessons/nes-cpu-modes.js"></script>
  <script src="lessons/nes-cpu-ops.js"></script>
  <script src="lessons/nes-data.js"></script>
  <script src="lessons/nes-common.js"></script>
  <script src="lessons/nes-cart.js"></script>
  <script src="lessons/nes-ppu-tiles.js"></script>
  <script src="lessons/nes-ppu-bg.js"></script>
  <script src="lessons/nes-ppu-sprites.js"></script>
  <script src="lessons/nes-input.js"></script>
  <script src="lessons/nes-scroll.js"></script>

  <script src="js/checker.js"></script>
  <script src="js/highlight.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/compiler-client.js"></script>
  <script src="js/console.js"></script>
  <script src="js/zip.js"></script>
  <script src="js/roms.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
